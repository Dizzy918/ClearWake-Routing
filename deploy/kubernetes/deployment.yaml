apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearwake-api
  labels:
    app: clearwake-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clearwake-api
  template:
    metadata:
      labels:
        app: clearwake-api
    spec:
      containers:
        - name: api
          image: ghcr.io/dizzy918/clearwake-routing:63409bf73d839979674bc91eea895c27c899c1ca
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: clearwake-config
            - secretRef:
                name: clearwake-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/zones/
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/zones/
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
